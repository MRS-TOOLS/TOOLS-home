<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>買っちゃった/耐えたログ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="app-header">
    <h1 class="logo">買っちゃった<span class="amp">/</span>耐えた<span class="logo-diary">ログ</span></h1>
  </header>

  <main class="tab-content">

    <!-- ============ 記録 ============ -->
    <section id="tab-record" class="tab-panel is-active">
      <p class="panel-lead">今日のお金の動きを記録しましょう</p>

      <div class="type-select" id="typeSelect">
        <button type="button" class="type-btn type-wasted" data-type="wasted">
          <span class="type-btn-label">買っちゃった</span>
          <span class="type-btn-sub">無駄遣い・浪費</span>
        </button>
        <button type="button" class="type-btn type-endured" data-type="endured">
          <span class="type-btn-label">耐えた</span>
          <span class="type-btn-sub">節約・我慢</span>
        </button>
      </div>

      <form class="entry-form" id="entryForm" hidden>
        <div class="selected-type-chip" id="selectedTypeChip"></div>

        <label class="field-label" for="entryDatetime">日時</label>
        <input type="datetime-local" id="entryDatetime" class="text-input" required>

        <label class="field-label" for="entryItemName">品名・内容</label>
        <input type="text" id="entryItemName" class="text-input" placeholder="例：コンビニスイーツ" maxlength="60">

        <label class="field-label" for="entryPlace">場所・店舗</label>
        <input type="text" id="entryPlace" class="text-input" placeholder="例：セブンイレブン" maxlength="60">

        <label class="field-label" for="entryAmount">金額（円）</label>
        <input type="number" id="entryAmount" class="text-input" inputmode="numeric" min="0" step="1" placeholder="0" required>

        <div class="tag-field-header">
          <span class="field-label">タグ</span>
          <button type="button" id="openTagManageBtn" class="text-btn">タグを管理</button>
        </div>
        <div class="tag-chip-select" id="entryTagSelect"></div>
        <p class="tag-empty-hint" id="tagEmptyHint" hidden>タグがまだありません。「タグを管理」から追加してください。</p>

        <div class="form-actions">
          <button type="button" id="entryCancelBtn" class="secondary-btn">選び直す</button>
          <button type="submit" id="entrySaveBtn" class="primary-btn">保存する</button>
        </div>
      </form>

      <div class="recent-entries-block">
        <h2 class="block-title">最近の記録</h2>
        <div id="recentEntryList" class="recent-entry-list"></div>
        <p id="recentEmptyState" class="empty-state" hidden>まだ記録がありません</p>
      </div>
    </section>

    <!-- ============ 確認 ============ -->
    <section id="tab-check" class="tab-panel">

      <div class="period-toggle" id="periodToggle">
        <button type="button" class="seg-btn is-active" data-period="month">月間</button>
        <button type="button" class="seg-btn" data-period="year">年間</button>
      </div>

      <div class="period-nav">
        <button type="button" id="periodPrevBtn" class="period-nav-btn" aria-label="前へ">‹</button>
        <span id="periodLabel" class="period-label"></span>
        <button type="button" id="periodNextBtn" class="period-nav-btn" aria-label="次へ">›</button>
      </div>

      <div class="summary-cards">
        <div class="summary-card summary-wasted">
          <span class="summary-card-label">買っちゃった合計</span>
          <span id="summaryWasted" class="summary-card-value">¥0</span>
        </div>
        <div class="summary-card summary-endured">
          <span class="summary-card-label">耐えた合計</span>
          <span id="summaryEndured" class="summary-card-value">¥0</span>
        </div>
        <div class="summary-card summary-diff">
          <span class="summary-card-label">差額</span>
          <span id="summaryDiff" class="summary-card-value">¥0</span>
        </div>
      </div>

      <div class="graph-block">
        <div class="graph-header">
          <h2 class="graph-title">グラフ</h2>
          <div class="graph-type-toggle" id="graphTypeToggle">
            <button type="button" class="mini-seg-btn is-active" data-graph="endured">耐えた</button>
            <button type="button" class="mini-seg-btn" data-graph="wasted">買っちゃった</button>
            <button type="button" class="mini-seg-btn" data-graph="diff">差額</button>
          </div>
        </div>
        <div class="chart-legend">
          <span class="legend-item"><span class="legend-swatch legend-bar"></span>期間ごとの金額</span>
          <span class="legend-item"><span class="legend-swatch legend-line"></span>累計</span>
        </div>
        <div id="chartWrapper" class="chart-wrapper"></div>
      </div>

      <div class="tag-summary-block">
        <h2 class="block-title">タグ別集計</h2>
        <div id="tagSummaryTable" class="tag-summary-table"></div>
        <p id="tagSummaryEmpty" class="empty-state" hidden>この期間の記録がありません</p>
      </div>

    </section>

    <!-- ============ 計画 ============ -->
    <section id="tab-plan" class="tab-panel">

      <div class="plan-header-row">
        <h2 class="block-title plan-header-title">計画</h2>
        <button type="button" id="planSettingsBtn" class="gear-btn" aria-label="計画を再設定" hidden>⚙️</button>
      </div>

      <div class="plan-progress-block" id="planProgressBlock" hidden>
        <h2 class="block-title" id="planNameDisplay"></h2>
        <div class="progress-bar-outer">
          <div id="planProgressBar" class="progress-bar-inner"></div>
        </div>
        <div class="progress-numbers">
          <span id="planProgressPercent" class="progress-percent">0%</span>
          <span id="planProgressAmounts" class="progress-amounts"></span>
        </div>
        <div class="plan-meta-row">
          <span id="planDeadlineText" class="plan-meta"></span>
          <span id="planRewardText" class="plan-meta"></span>
        </div>

        <div class="plan-chart-block">
          <div class="chart-legend">
            <span class="legend-item"><span class="legend-swatch legend-line"></span>積立の推移</span>
            <span class="legend-item"><span class="legend-swatch legend-target"></span>目標金額</span>
          </div>
          <div id="planChartWrapper" class="chart-wrapper"></div>
        </div>
      </div>
      <p id="planEmptyState" class="empty-state" hidden>まだ計画が設定されていません</p>

      <form class="plan-form" id="planForm">
        <h2 class="block-title">計画を設定</h2>

        <label class="field-label" for="planName">計画名</label>
        <input type="text" id="planName" class="text-input" placeholder="例：夏のボーナス貯金" maxlength="60" required>

        <label class="field-label" for="planTargetAmount">目標金額（円）</label>
        <input type="number" id="planTargetAmount" class="text-input" inputmode="numeric" min="0" step="1" placeholder="0" required>

        <label class="field-label" for="planDeadline">目標納期</label>
        <input type="date" id="planDeadline" class="text-input">

        <label class="field-label" for="planReward">ご褒美内容</label>
        <input type="text" id="planReward" class="text-input" placeholder="例：欲しかった靴を買う" maxlength="60">

        <div class="switch-row">
          <span class="field-label switch-label">「買っちゃった」を積立からマイナスする</span>
          <label class="switch">
            <input type="checkbox" id="planSubtractWasted" checked>
            <span class="slider"></span>
          </label>
        </div>

        <div class="form-actions">
          <button type="submit" id="planSaveBtn" class="primary-btn">計画を保存する</button>
        </div>

        <button type="button" id="planDeleteBtn" class="text-btn plan-delete-btn" hidden>この計画を削除する</button>
      </form>

    </section>

  </main>

  <nav class="tab-bar">
    <button type="button" class="tab-btn is-active" data-tab="record">
      <span class="tab-icon">📝</span><span class="tab-label">記録</span>
    </button>
    <button type="button" class="tab-btn" data-tab="check">
      <span class="tab-icon">📊</span><span class="tab-label">確認</span>
    </button>
    <button type="button" class="tab-btn" data-tab="plan">
      <span class="tab-icon">🎯</span><span class="tab-label">計画</span>
    </button>
  </nav>

  <!-- MRS TOOLS リンク -->
  <p class="mrs-tools-link-wrap">
    <a href="https://mrs-tools.pages.dev/" target="_blank" rel="noopener noreferrer" class="mrs-tools-link">MRS TOOLS</a>
  </p>

</div>

<!-- 記録編集モーダル -->
<div id="editEntryModal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h3 class="modal-title">記録を編集</h3>
    <div class="type-select type-select-modal" id="editTypeSelect">
      <button type="button" class="type-btn type-wasted" data-type="wasted">
        <span class="type-btn-label">買っちゃった</span>
      </button>
      <button type="button" class="type-btn type-endured" data-type="endured">
        <span class="type-btn-label">耐えた</span>
      </button>
    </div>

    <label class="field-label" for="editDatetime">日時</label>
    <input type="datetime-local" id="editDatetime" class="text-input">

    <label class="field-label" for="editItemName">品名・内容</label>
    <input type="text" id="editItemName" class="text-input" maxlength="60">

    <label class="field-label" for="editPlace">場所・店舗</label>
    <input type="text" id="editPlace" class="text-input" maxlength="60">

    <label class="field-label" for="editAmount">金額（円）</label>
    <input type="number" id="editAmount" class="text-input" inputmode="numeric" min="0" step="1">

    <span class="field-label">タグ</span>
    <div class="tag-chip-select" id="editTagSelect"></div>

    <div class="modal-actions">
      <button type="button" id="editCancelBtn" class="secondary-btn">キャンセル</button>
      <button type="button" id="editSaveBtn" class="primary-btn">更新する</button>
    </div>
  </div>
</div>

<!-- タグ管理モーダル -->
<div id="tagManageModal" class="modal-overlay" hidden>
  <div class="modal-card">
    <h3 class="modal-title">タグを管理</h3>

    <div class="tag-manage-list" id="tagManageList"></div>
    <p id="tagManageEmpty" class="empty-state" hidden>タグがまだありません</p>

    <div class="tag-add-row">
      <input type="text" id="newTagInput" class="text-input" placeholder="新しいタグ名" maxlength="20">
      <button type="button" id="addTagBtn" class="primary-btn tag-add-btn">追加</button>
    </div>

    <div class="modal-actions">
      <button type="button" id="tagManageCloseBtn" class="secondary-btn">閉じる</button>
    </div>
  </div>
</div>

<!-- トースト通知 -->
<div id="toast" class="toast" hidden></div>

<!-- 画面固定広告 -->
<div class="ad-banner">
    <div style="max-width: 100%;">
        <!-- admax -->
        <script src="https://adm.shinobi.jp/s/1596a166ea799d6e2c02f5a97ee144c2"></script>
        <!-- admax -->
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
