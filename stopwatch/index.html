<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ストップウォッチ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: #E0E0E0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        input[type="text"] {
            -webkit-user-select: text;
            user-select: text;
        }

        header {
            background-color: #121212;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-around;
            padding: 8px;
            flex-shrink: 0;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: #888;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.2s;
        }

        .tab-btn.active {
            color: #FF9800;
            border-bottom-color: #FF9800;
        }

        main {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .tab-content {
            display: none;
            height: 100%;
            flex-direction: column;
            padding: 15px;
        }

        .tab-content.active {
            display: flex;
        }

        /* ===== シングル ===== */
        .single-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
            height: 100%;
        }

        .single-timer-card {
            background-color: #121212;
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            border: 1px solid #222;
            flex-shrink: 0;
        }

        .single-time-display {
            font-size: 48px;
            font-weight: bold;
            color: #FFF;
            font-variant-numeric: tabular-nums;
            margin: 8px 0;
            letter-spacing: 1px;
        }

        .single-time-display .ms-part {
            font-size: 26px;
            color: #FF9800;
        }

        .single-controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 15px;
        }

        .round-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: none;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .round-btn:active {
            opacity: 0.8;
        }

        .btn-big-start { background-color: #2E7D32; color: #81C784; }
        .btn-big-pause { background-color: #E65100; color: #FFB74D; }
        .btn-big-lap { background-color: #1E1E1E; color: #AAA; border: 1px solid #333; }
        .btn-big-lap:disabled { opacity: 0.3; cursor: default; }
        .btn-big-reset { background-color: #1E1E1E; color: #E57373; border: 1px solid #333; }
        .btn-big-reset:disabled { opacity: 0.3; cursor: default; }

        .laps-card {
            background-color: #121212;
            border-radius: 16px;
            border: 1px solid #222;
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            min-height: 0;
        }

        .laps-header {
            padding: 12px 16px;
            font-size: 13px;
            color: #888;
            border-bottom: 1px solid #222;
            display: flex;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .laps-list {
            overflow-y: auto;
            flex: 1;
        }

        .lap-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid #1A1A1A;
            font-size: 15px;
            font-variant-numeric: tabular-nums;
        }

        .lap-row:last-child {
            border-bottom: none;
        }

        .lap-row.fastest .lap-diff {
            color: #4CAF50;
        }

        .lap-row.slowest .lap-diff {
            color: #E57373;
        }

        .lap-num {
            color: #888;
            width: 55px;
            flex-shrink: 0;
        }

        .lap-diff {
            color: #EEE;
            flex: 1;
            text-align: left;
            padding-left: 10px;
        }

        .lap-total {
            color: #666;
            flex-shrink: 0;
        }

        /* ===== マルチ ===== */
        .multi-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 450px;
            margin: 0 auto;
            width: 100%;
        }

        .add-sw-card {
            background-color: #121212;
            border-radius: 16px;
            border: 1px solid #222;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .label-input {
            flex: 1;
            padding: 10px;
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            color: #FFF;
            font-size: 14px;
        }

        .label-input:focus {
            outline: none;
            border-color: #FF9800;
        }

        .add-btn {
            padding: 10px 20px;
            background-color: #FF9800;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            white-space: nowrap;
        }

        .add-btn:active {
            opacity: 0.8;
        }

        .sw-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sw-card {
            background-color: #121212;
            border-radius: 16px;
            padding: 15px;
            border: 1px solid #222;
        }

        .sw-card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sw-label-input {
            flex: 1;
            padding: 8px 10px;
            background-color: #1E1E1E;
            border: 1px solid #333;
            border-radius: 8px;
            color: #FFB74D;
            font-size: 14px;
            font-weight: bold;
        }

        .sw-label-input:focus {
            outline: none;
            border-color: #FF9800;
        }

        .sw-card-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sw-time-text {
            font-size: 26px;
            font-weight: 300;
            font-variant-numeric: tabular-nums;
            color: #FFF;
        }

        .sw-time-text .ms-part {
            font-size: 15px;
            color: #FF9800;
        }

        .sw-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sm-circle-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: none;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #FFF;
        }

        .btn-start { background-color: #2E7D32; color: #81C784; }
        .btn-pause { background-color: #E65100; color: #FFB74D; }
        .btn-reset { background-color: #222; color: #AAA; }
        .btn-delete { background-color: transparent; color: #E57373; font-size: 16px; border: 1px solid #333; width: 30px; height: 30px; }

        .empty-msg {
            text-align: center;
            color: #555;
            padding: 30px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <button class="tab-btn active" onclick="switchTab('single')">シングル</button>
        <button class="tab-btn" onclick="switchTab('multi')">マルチ</button>
    </header>

    <main>
        <div id="single-tab" class="tab-content active">
            <div class="single-container">
                <div class="single-timer-card">
                    <div id="single-display" class="single-time-display">00:00<span class="ms-part">.00</span></div>
                    <div class="single-controls">
                        <button id="single-lap-btn" class="round-btn btn-big-lap" onclick="lapSingle()" disabled>ラップ</button>
                        <button id="single-start-btn" class="round-btn btn-big-start" onclick="toggleSingle()">スタート</button>
                        <button id="single-reset-btn" class="round-btn btn-big-reset" onclick="resetSingle()" disabled>リセット</button>
                    </div>
                </div>

                <div class="laps-card">
                    <div class="laps-header">
                        <span>ラップ</span>
                        <span>合計</span>
                    </div>
                    <div id="laps-list" class="laps-list"></div>
                </div>
            </div>
        </div>

        <div id="multi-tab" class="tab-content">
            <div class="multi-container">
                <div class="add-sw-card">
                    <input type="text" id="new-sw-label" class="label-input" placeholder="ストップウォッチ名を入力">
                    <button class="add-btn" onclick="addStopwatch()">＋ 追加</button>
                </div>

                <div id="sw-list" class="sw-list"></div>
            </div>
        </div>
    </main>

    <script>
        // ===================== 共通 =====================
        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'single') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('single-tab').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('multi-tab').classList.add('active');
            }
        }

        function formatTime(ms, withMs = true) {
            const totalMs = Math.max(0, ms);
            const h = Math.floor(totalMs / 3600000);
            const m = Math.floor((totalMs % 3600000) / 60000);
            const s = Math.floor((totalMs % 60000) / 1000);
            const cs = Math.floor((totalMs % 1000) / 10);

            let main;
            if (h > 0) {
                main = `${h}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            } else {
                main = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            if (!withMs) return main;
            return { main, cs: String(cs).padStart(2, '0') };
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // ===================== シングル =====================
        let single = {
            running: false,
            startTs: 0,
            accumulatedMs: 0,
            intervalId: null,
            laps: [] // { totalMs, lapMs }
        };

        function getSingleElapsed() {
            if (single.running) {
                return single.accumulatedMs + (Date.now() - single.startTs);
            }
            return single.accumulatedMs;
        }

        function renderSingleDisplay() {
            const el = document.getElementById('single-display');
            const t = formatTime(getSingleElapsed());
            el.innerHTML = `${t.main}<span class="ms-part">.${t.cs}</span>`;
        }

        function toggleSingle() {
            const startBtn = document.getElementById('single-start-btn');
            const lapBtn = document.getElementById('single-lap-btn');
            const resetBtn = document.getElementById('single-reset-btn');

            if (single.running) {
                single.accumulatedMs = getSingleElapsed();
                single.running = false;
                clearInterval(single.intervalId);

                startBtn.textContent = '再開';
                startBtn.className = 'round-btn btn-big-start';
                lapBtn.disabled = true;
                resetBtn.disabled = false;
            } else {
                single.startTs = Date.now();
                single.running = true;

                startBtn.textContent = 'ストップ';
                startBtn.className = 'round-btn btn-big-pause';
                lapBtn.disabled = false;
                resetBtn.disabled = true;

                single.intervalId = setInterval(renderSingleDisplay, 30);
            }
            renderSingleDisplay();
        }

        function lapSingle() {
            if (!single.running) return;
            const totalMs = getSingleElapsed();
            const prevTotal = single.laps.length > 0 ? single.laps[single.laps.length - 1].totalMs : 0;
            single.laps.push({ totalMs, lapMs: totalMs - prevTotal });
            renderLaps();
        }

        function resetSingle() {
            if (single.running) return;
            single.accumulatedMs = 0;
            single.laps = [];
            renderSingleDisplay();
            renderLaps();
            document.getElementById('single-start-btn').textContent = 'スタート';
            document.getElementById('single-reset-btn').disabled = true;
        }

        function renderLaps() {
            const list = document.getElementById('laps-list');
            list.innerHTML = '';

            if (single.laps.length === 0) {
                list.innerHTML = '<div class="empty-msg">ラップはまだありません</div>';
                return;
            }

            let fastestIdx = -1, slowestIdx = -1;
            if (single.laps.length > 1) {
                let fastest = Infinity, slowest = -Infinity;
                single.laps.forEach((l, i) => {
                    if (l.lapMs < fastest) { fastest = l.lapMs; fastestIdx = i; }
                    if (l.lapMs > slowest) { slowest = l.lapMs; slowestIdx = i; }
                });
            }

            for (let i = single.laps.length - 1; i >= 0; i--) {
                const lap = single.laps[i];
                const row = document.createElement('div');
                let cls = 'lap-row';
                if (i === fastestIdx) cls += ' fastest';
                if (i === slowestIdx) cls += ' slowest';
                row.className = cls;

                const lapT = formatTime(lap.lapMs);
                const totalT = formatTime(lap.totalMs);

                row.innerHTML = `
                    <span class="lap-num">Lap ${i + 1}</span>
                    <span class="lap-diff">${lapT.main}.${lapT.cs}</span>
                    <span class="lap-total">${totalT.main}.${totalT.cs}</span>
                `;
                list.appendChild(row);
            }
        }

        // ===================== マルチ =====================
        let stopwatches = [];
        let swCounter = 1;

        function renderStopwatches() {
            const container = document.getElementById('sw-list');
            container.innerHTML = '';

            if (stopwatches.length === 0) {
                container.innerHTML = '<div class="empty-msg">ストップウォッチを追加してください</div>';
                return;
            }

            stopwatches.forEach(sw => {
                const elapsed = sw.running ? sw.accumulatedMs + (Date.now() - sw.startTs) : sw.accumulatedMs;
                const t = formatTime(elapsed);

                const card = document.createElement('div');
                card.className = 'sw-card';
                card.dataset.id = sw.id;
                card.innerHTML = `
                    <div class="sw-card-top">
                        <input type="text" class="sw-label-input" value="${escapeHtml(sw.label)}"
                            oninput="updateSwLabel(${sw.id}, this.value)">
                    </div>
                    <div class="sw-card-bottom">
                        <div class="sw-time-text" id="sw-time-${sw.id}">${t.main}<span class="ms-part">.${t.cs}</span></div>
                        <div class="sw-controls">
                            <button class="sm-circle-btn ${sw.running ? 'btn-pause' : 'btn-start'}" onclick="toggleSw(${sw.id})">
                                ${sw.running ? 'ストップ' : 'スタート'}
                            </button>
                            <button class="sm-circle-btn btn-reset" onclick="resetSw(${sw.id})">リセット</button>
                            <button class="sm-circle-btn btn-delete" onclick="deleteSw(${sw.id})">✕</button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // 実行中カードの時間表示だけを更新する（DOM要素の作り直しをしないためタップが途切れない）
        function updateRunningSwDisplays() {
            stopwatches.forEach(sw => {
                if (!sw.running) return;
                const timeEl = document.getElementById(`sw-time-${sw.id}`);
                if (!timeEl) return;
                const elapsed = sw.accumulatedMs + (Date.now() - sw.startTs);
                const t = formatTime(elapsed);
                timeEl.innerHTML = `${t.main}<span class="ms-part">.${t.cs}</span>`;
            });
        }

        function addStopwatch() {
            const labelInput = document.getElementById('new-sw-label');
            const label = labelInput.value.trim() || `ストップウォッチ ${swCounter}`;
            swCounter++;

            stopwatches.push({
                id: Date.now() + Math.random(),
                label: label,
                running: false,
                startTs: 0,
                accumulatedMs: 0,
                intervalId: null
            });

            labelInput.value = '';
            renderStopwatches();
        }

        function updateSwLabel(id, value) {
            const sw = stopwatches.find(s => s.id === id);
            if (sw) sw.label = value;
        }

        function toggleSw(id) {
            const sw = stopwatches.find(s => s.id === id);
            if (!sw) return;

            if (sw.running) {
                sw.accumulatedMs = sw.accumulatedMs + (Date.now() - sw.startTs);
                sw.running = false;
                clearInterval(sw.intervalId);
            } else {
                sw.startTs = Date.now();
                sw.running = true;
                // 全体を再描画せず、この個体の時間表示のみを更新し続ける
                sw.intervalId = setInterval(updateRunningSwDisplays, 30);
            }
            renderStopwatches();
        }

        function resetSw(id) {
            const sw = stopwatches.find(s => s.id === id);
            if (!sw) return;
            clearInterval(sw.intervalId);
            sw.running = false;
            sw.accumulatedMs = 0;
            renderStopwatches();
        }

        function deleteSw(id) {
            const sw = stopwatches.find(s => s.id === id);
            if (sw) clearInterval(sw.intervalId);
            stopwatches = stopwatches.filter(s => s.id !== id);
            renderStopwatches();
        }

        // ===================== 初期化 =====================
        window.onload = function() {
            renderSingleDisplay();
            renderLaps();
            renderStopwatches();
        };
    </script>
</body>
</html>
