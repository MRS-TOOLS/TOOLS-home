<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <!-- スマホ向けViewport設定（自動ズーム・誤作動防止） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>スマホ向けカウンター</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ヘッダー：タブ選択 -->
    <header>
        <button class="tab-btn active" onclick="switchTab('single')">シングル</button>
        <button class="tab-btn" onclick="switchTab('multi')">マルチ</button>
    </header>

    <main>
        <!-- シングルカウンター タブ -->
        <div id="single-tab" class="tab-content active">
            <div class="single-container">
                <div class="count-display-section">
                    <div id="single-count" class="count-number">0</div>
                    <div class="btn-group" style="margin-bottom: 10px;">
                        <button class="btn btn-minus" onclick="changeSingleCount(-1)">ー</button>
                        <button class="btn btn-plus" onclick="changeSingleCount(1)">＋</button>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-reset" onclick="resetSingleCount()">リセット</button>
                        <button class="btn btn-save" onclick="saveSingleHistory()">保存</button>
                    </div>
                </div>

                <div class="history-section">
                    <div class="history-header">
                        <span class="history-title">保存履歴</span>
                        <button class="clear-history-btn" onclick="clearSingleHistory()">全削除</button>
                    </div>
                    <div class="custom-table-wrapper">
                        <table class="custom-table">
                            <thead>
                                <tr>
                                    <th>No.</th>
                                    <th>日時</th>
                                    <th>ラベル</th>
                                    <th style="text-align: right;">カウント</th>
                                </tr>
                            </thead>
                            <tbody id="single-history-body">
                                <!-- JavaScriptで動的に追加されます -->
                            </tbody>
                        </table>
                    </div>

                    <!-- MRS TOOLS リンクエリア -->
                    <div class="footer-link-container">
                        <a href="https://mrs-tools.pages.dev" target="_blank" rel="noopener noreferrer" class="btn-footer-link">MRS TOOLS</a>
                    </div>
                </div>
            </div>
        </div>

        <!-- マルチカウンター タブ -->
        <div id="multi-tab" class="tab-content">
            <div class="multi-container">
                <div class="multi-controls">
                    <button class="add-counter-btn" onclick="addMultiCounter()">＋ カウンター追加</button>
                    <button class="save-score-btn" onclick="saveMultiHistory()">保存</button>
                </div>

                <div id="multi-list" class="multi-list">
                    <!-- カウンターカードがJavaScriptで挿入されます -->
                </div>

                <!-- 保存履歴一覧エリア -->
                <div class="history-board-section">
                    <div class="history-board-header">
                        <span class="history-board-title">保存履歴</span>
                        <button class="clear-history-btn" onclick="clearMultiHistory()">履歴クリア</button>
                    </div>
                    <div class="custom-table-wrapper">
                        <table class="custom-table history-table" id="history-table">
                            <thead id="history-table-head">
                                <!-- JavaScriptで動的に挿入されます -->
                            </thead>
                            <tbody id="history-table-body">
                                <!-- JavaScriptで動的に挿入されます -->
                            </tbody>
                            <tfoot id="history-table-foot">
                                <!-- 各項目ごとの合計が動的に挿入されます -->
                            </tfoot>
                        </table>
                    </div>
                </div>

                <!-- MRS TOOLS リンクエリア -->
                <div class="footer-link-container">
                    <a href="https://mrs-tools.pages.dev" target="_blank" rel="noopener noreferrer" class="btn-footer-link">MRS TOOLS</a>
                </div>
            </div>
        </div>
        <details style="margin:16px;padding:14px;border:1px solid #444;border-radius:10px">
            <summary>新カウンターへのデータ移行</summary>
            <p style="margin:12px 0;font-size:14px">カウント・項目・保存履歴をJSONファイルに書き出します。移行先の「データ読み込み」で引き継げます。</p>
            <button type="button" onclick="exportCounterData()" style="min-height:44px;padding:8px 12px">データ書き出し</button>
            <p id="transfer-status" role="status" aria-live="polite" style="margin-top:10px;font-size:14px"></p>
        </details>
    </main>

    <!-- ========================================
         固定広告
    ========================================= -->
    <div class="ad-banner">
        <div style="max-width: 100%;">
            <!-- admax -->
            <script src="https://adm.shinobi.jp/s/8a495d941206bf0c34aff9559f8d2cea"></script>
            <!-- admax -->
        </div>
    </div>
    
    <script src="script.js"></script>
    <script src="data-transfer.js?v=1"></script>
</body>
</html>
